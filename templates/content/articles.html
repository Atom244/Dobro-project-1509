{% extends 'base.html' %}{% block title %}Права граждан{% endblock %}{% block content %}<div class="container section"><span class="eyebrow">Знания</span><h1>Права граждан</h1><form class="search-form"><input name="q" value="{{q}}" placeholder="Найти статью"><button class="btn btn-primary">Поиск</button></form><div class="cards">{% for item in page %}<a class="feature" href="{% url 'article-detail' item.slug %}"><span class="tag">{{item.category}}</span><h3>{{item.title}}</h3><p>{{item.short_description}}</p></a>{% empty %}<div class="empty">Материалы не найдены.</div>{% endfor %}</div></div>{% endblock %}
