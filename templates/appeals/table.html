{% if appeals %}<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Номер</th><th>Тема</th><th>Статус</th><th>Дата</th></tr></thead><tbody>{% for appeal in appeals %}<tr><td><a href="{% url 'appeal-detail' appeal.public_id %}">{{ appeal.public_id }}</a></td><td>{{ appeal.subject }}</td><td><span class="status">{{ appeal.get_status_display }}</span></td><td>{{ appeal.created_at|date:'d.m.Y' }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<div class="empty">У вас пока нет обращений.</div>{% endif %}
